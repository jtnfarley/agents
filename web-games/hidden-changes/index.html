<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hidden Changes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the board sits left and the song, meters and hints sit right on wide screens; one column on phones. */
:root{
  --bg:#e9ecf3; --surface:#f6f7fb; --well:#dde1ea; --line:#c3c9d7;
  --fg:#151a27; --muted:#565f74; --veil:rgba(233,236,243,.84); --zone:rgba(21,26,39,.06);
  --good:#0f7a43; --warn:#9a5b00; --bad:#b3261e; --ink:#11131a;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  /* one color per pitch class, C through B */
  --c0:#ff6b6b; --c1:#ff8f5a; --c2:#ffb84d; --c3:#f2d94e; --c4:#b6e35a; --c5:#5fdc8a;
  --c6:#4fd9c4; --c7:#55c4f2; --c8:#6f9bff; --c9:#a58bff; --c10:#dd7bf0; --c11:#ff7fb5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1118; --surface:#171b26; --well:#11141d; --line:#2b3245;
    --fg:#eef0f7; --muted:#98a1b8; --veil:rgba(14,17,24,.84); --zone:rgba(255,255,255,.045);
    --good:#5fdc8a; --warn:#ffb84d; --bad:#ff7a70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1118; --surface:#171b26; --well:#11141d; --line:#2b3245;
  --fg:#eef0f7; --muted:#98a1b8; --veil:rgba(14,17,24,.84); --zone:rgba(255,255,255,.045);
  --good:#5fdc8a; --warn:#ffb84d; --bad:#ff7a70; color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:18px 28px;font-optical-sizing:auto}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}

.app{display:flex;flex-direction:column;gap:16px;max-width:940px;margin-inline:auto}
.side{display:contents}
.head{order:0}
.levels{order:1}
.prog{order:2}
.hud{order:3}
.board-wrap{order:4}
.tools{order:5}
.legend{order:6}

.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 16px}
.brand{min-width:0}
h1{margin:0;font-size:clamp(1.7rem,5.4vw,2.35rem);line-height:1;font-weight:800;letter-spacing:-.01em;font-variation-settings:"wdth" 78}
.brand p{margin:6px 0 0;color:var(--muted);font-size:.95rem;max-width:34ch}
.ctrls{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:168px}
.ibtn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;padding:0;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;touch-action:manipulation}
.ibtn:hover:not([disabled]){border-color:var(--fg)}
.ibtn:focus-visible,.ibtn:focus-within{outline:3px solid var(--fg);outline-offset:2px}
.ibtn[disabled]{opacity:.42;cursor:not-allowed}
.ibtn[aria-pressed="true"].tog{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ibtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ibtn select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.ibtn .off,.ibtn .play{display:none}
.ibtn.is-off .on,.ibtn.is-play .pause{display:none}
.ibtn.is-off .off,.ibtn.is-play .play{display:block}
@media (min-width:600px){.ctrls{max-width:none;flex-wrap:nowrap}}
.sep-i{width:1px;height:24px;background:var(--line);margin-inline:2px}

.btn{border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;min-height:40px;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:hover:not([disabled]){border-color:var(--fg)}
.btn:focus-visible,.segb:focus-visible,.hit:focus-visible,.lvl:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.cost{font-family:var(--mono);font-weight:400;font-size:.74rem;color:var(--muted);margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.segb{border:0;background:transparent;padding:8px 14px;min-height:40px;font-weight:600;cursor:pointer}
.segb[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ctx{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:0;font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.pips{display:inline-flex;gap:4px}
.pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.pip.on{background:var(--fg);border-color:var(--fg)}
.pip.cur{border-color:var(--fg)}
.sofar{flex-basis:100%;color:var(--fg)}
.fs{display:flex;flex-direction:column;gap:7px}
.fs-row{display:flex;gap:8px;align-items:flex-start}
.fs-n{font-family:var(--mono);font-size:.72rem;color:var(--muted);width:1.1em;padding-top:.7em}
.fs-c,.bk-c{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.fs-c span,.bk-c span{display:inline-flex;flex-direction:column;align-items:center;border:1.5px solid var(--fg);border-radius:8px;padding:1px 7px;line-height:1.15;transition:background .1s}
.fs-c b,.bk-c b{font-weight:800;font-size:.92rem;font-variation-settings:"wdth" 85}
.fs-c i,.bk-c i{font-style:normal;font-family:var(--mono);font-size:.62rem;color:var(--muted)}
.fs-c span.playing,.bk-c span.playing{background:var(--fg);color:var(--bg)}
.fs-c span.playing i,.bk-c span.playing i{color:inherit}
.sep{width:8px}
.card.book .slots{margin-bottom:2px}
.card.book{max-width:380px}
.bk{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bk-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.bk.locked{color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.84rem;align-self:flex-start}
.linkbtn:hover{color:var(--fg)}

.eyebrow{margin:0;font-family:var(--mono);font-weight:500;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.levels{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.lvls{display:flex;gap:6px}
.lvl{flex:0 1 42px;min-width:0;padding:0;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-weight:500;font-size:1rem;cursor:pointer;touch-action:manipulation}
.lvl:hover{border-color:var(--fg)}
.lvl[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.nrow{display:flex;align-items:center;gap:10px}
.nrow .lvls{flex:1 1 auto;min-width:0}
.nrow .lvl{flex:1 1 0;max-width:none}
.nrow .lvls{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.nrow .lvl{width:auto;height:42px}
.nrow .lvl.gm{height:36px}
.nrow .eyebrow{flex:0 0 3.6rem}
.levelname{grid-column:6/10;text-align:right;align-self:center;line-height:1.15}
.levels{display:flex;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:8px}
.lvl.gm{height:36px;font-size:.92rem}
.lvl.done{box-shadow:inset 0 -3px 0 var(--fg)}
.lvl.locked{border-style:dashed;background:transparent;color:var(--muted)}
.levelname{font-weight:700;font-size:1.05rem;font-variation-settings:"wdth" 88}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.prog-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
#keyline{font-size:.8rem;color:var(--fg)}
.slots{display:flex;gap:6px}
.slots[data-n="8"]{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.slot{flex:1 1 0;min-width:0;border:1.5px dashed var(--line);border-radius:10px;padding:9px 2px 7px;display:grid;justify-items:center;gap:5px;text-align:center;transition:background .15s}
.slot.found{border-style:solid;border-color:var(--fg)}
.slot.missed{border-style:solid;border-color:var(--bad)}
.slot.missed .slot-name{color:var(--bad)}
.slot.playing{background:var(--well)}
.slot-name{font-weight:800;font-size:1.25rem;line-height:1;white-space:nowrap;font-variation-settings:"wdth" 85;color:var(--muted)}
.slot.found .slot-name{color:var(--fg)}
.slot-name.long{font-size:1rem}
.slot-name.clue{font-style:italic;color:var(--fg);opacity:.75}
.slot-name.xl{font-size:.82rem}
.slots[data-n="5"] .slot-name.xl,.slots[data-n="6"] .slot-name.xl{font-size:.7rem}
.slots[data-n="5"] .slot-name,.slots[data-n="6"] .slot-name{font-size:1.02rem}
.slots[data-n="5"] .slot-name.long,.slots[data-n="6"] .slot-name.long{font-size:.84rem}
.slots[data-n="8"] .slot-name{font-size:1.1rem}
.slots[data-n="8"] .slot-name.long{font-size:.95rem}
.slots.wide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.slots.wide .slot-name{font-size:1.05rem}
.slots.wide .slot-name.long{font-size:.95rem}
.slots.wide .slot-name.xl{font-size:.88rem}
.dots{display:flex;gap:3px;height:9px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.dots i.on{border:0}
.slot-num{font-family:var(--mono);font-size:.72rem;color:var(--muted);min-height:1.1em;white-space:nowrap}
#count{margin:0;font-size:.78rem;color:var(--muted)}

.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.val{font-weight:800;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 88}
.focus{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto 3.4ch;align-items:center;gap:10px}
.note{font-size:.68rem;color:var(--muted);line-height:1.25}
.fdelta{font-size:.8rem;font-weight:500;opacity:0}
.fdelta.good{color:var(--good)}
.fdelta.bad{color:var(--bad)}
.fdelta.show{animation:fpop 1.4s ease forwards}
@keyframes fpop{0%{opacity:0;translate:0 4px}12%{opacity:1;translate:0 0}70%{opacity:1}100%{opacity:0}}
.track{height:10px;border-radius:999px;background:var(--well);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;width:100%;background:var(--good);border-radius:999px;transition:width .25s,background .25s}
.fill[data-level="mid"]{background:var(--warn)}
.fill[data-level="low"]{background:var(--bad)}
#fnum{font-size:.8rem;min-width:2.6ch;text-align:right;font-variant-numeric:tabular-nums}

.board-wrap{width:100%;max-width:440px;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.board{position:relative;width:100%;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--well);border:1px solid var(--line);user-select:none;-webkit-user-select:none}
.board.paused .layer,.board.paused .ghost{visibility:hidden}
.wells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))}
.well{position:relative;border-right:1px solid var(--line)}
.well:last-child{border-right:0}
.well::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--zone-h,37.5%);background:var(--zone);border-top:1px dashed var(--line)}
.layer{position:absolute;inset:0;pointer-events:none}
.tile{position:absolute;left:0;top:0;width:var(--tw,64px);height:var(--th,48px);border-radius:10px;background:var(--c);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:calc(var(--th,48px) * .52);line-height:1;font-variation-settings:"wdth" 85;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);will-change:transform}
.nm{white-space:nowrap}
.tile small{font-size:.55em;vertical-align:.55em;margin-left:1px}
.tile .role{position:absolute;left:4px;top:2px;font:700 11px/1 system-ui,sans-serif;font-style:normal;opacity:.75;pointer-events:none}
.tile.active{outline:3px solid var(--fg);outline-offset:2px}
.tile.locked{animation:lock .72s ease forwards}
.tile.nope{animation:nope .66s ease forwards}
@keyframes lock{0%{scale:1}35%{scale:1.1;filter:brightness(1.15)}100%{scale:.55;opacity:0}}
@keyframes nope{0%{translate:0}12%{translate:-6px}24%{translate:6px}36%{translate:-5px}48%{translate:4px}60%{translate:0;opacity:1}100%{translate:0;opacity:0}}
.ghost{position:absolute;left:0;top:0;width:var(--tw,64px);height:var(--th,48px);border-radius:10px;border:2px dashed var(--c,var(--fg));opacity:.7;pointer-events:none}
.vwrap{position:absolute;display:flex;justify-content:center;pointer-events:none}
.verdict{white-space:nowrap;font-weight:800;font-size:1.05rem;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);animation:rise 1.4s ease forwards;font-variation-settings:"wdth" 90}
.verdict.good{color:var(--good);border-color:var(--good)}
.verdict.bad{color:var(--bad);border-color:var(--bad)}
.verdict.neutral{color:var(--muted)}
@keyframes rise{0%{opacity:0;translate:0 6px}15%{opacity:1;translate:0 0}75%{opacity:1}100%{opacity:0;translate:0 -12px}}
.hits{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))}
.hit{background:transparent;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hit:hover{background:var(--zone)}
.hit:focus-visible{outline-offset:-3px}
[hidden]{display:none!important}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:14px;background:var(--veil);overflow:auto}
.card{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.overlay{container-type:inline-size}
.c-l,.c-r,.c-f{display:contents}
@container (min-width:500px){
  .card.ready{max-width:min(100%,680px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 26px;padding:22px}
  .card.ready .c-l,.card.ready .c-r,.card.ready .c-f{display:flex;flex-direction:column;gap:12px}
  .card.ready .c-f{grid-column:1/-1}
  .card.ready .c-f .btn.primary{align-self:stretch}
}
.card-title{margin:0;font-size:1.45rem;line-height:1.1;font-weight:800;font-variation-settings:"wdth" 82;text-wrap:balance}
.card p{margin:0}
.sub{font-size:.95rem}
.small{font-size:.84rem;color:var(--muted)}
.how{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.demo{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dt{width:36px;height:36px;border-radius:9px;background:var(--c);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:1.1rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.dt small{font-size:.58em;vertical-align:.5em}
.eq{font-family:var(--mono);color:var(--muted);padding:0 4px}
.dchip{font-weight:800;font-size:1.3rem;border:1.5px solid var(--fg);border-radius:9px;padding:2px 10px;font-variation-settings:"wdth" 85}
.chords{display:flex;gap:6px;flex-wrap:wrap}
.chords span{font-weight:800;border:1.5px solid var(--fg);border-radius:9px;padding:2px 10px;font-variation-settings:"wdth" 85}
.big{font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 85}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}

.collabels{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));text-align:center;font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.msg{margin:0;min-height:2.9em;font-size:.97rem;line-height:1.4}
.msg.good{color:var(--good)}
.msg.bad{color:var(--bad)}

.tools{display:flex;flex-wrap:wrap;gap:8px}
.legend{display:flex;flex-direction:column;gap:8px}
.pcs{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.pcs span{background:var(--c);color:var(--ink);border-radius:6px;padding:5px 0;text-align:center;font-family:var(--mono);font-weight:500;font-size:.66rem;line-height:1}
.pcs span.gone{opacity:.25;text-decoration:line-through}
.legend p{margin:0}

@media (min-width:860px){
  .app{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px 32px;align-items:start;max-width:1180px}
  .head{grid-column:1/-1}
  .levels{grid-column:1;grid-row:2}
  .board-wrap{grid-column:1;grid-row:3;margin-inline:0;max-width:none}
  .side{display:flex;flex-direction:column;gap:16px;grid-column:2;grid-row:3}
  .prog,.hud,.tools,.legend{order:0}
}
@media (prefers-reduced-motion:reduce){
  .tile.locked,.tile.nope,.verdict,.fdelta.show{animation-duration:.01s}
  .slot,.fill{transition:none}
}
</style>

<div class="app">
  <header class="head">
    <div class="brand">
      <h1>Hidden Changes</h1>
    </div>
    <div class="ctrls" role="toolbar" aria-label="Game controls">
      <button class="ibtn tog" id="m-learn" type="button" aria-pressed="true" title="Learn mode" aria-label="Learn mode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.2 2.7 3 6 3s6-1.8 6-3v-4.5"/><path d="M22 9v5"/></svg></button>
      <button class="ibtn tog" id="m-discover" type="button" aria-pressed="false" title="Discover mode" aria-label="Discover mode"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></button>
      <button class="ibtn" id="snd" type="button" aria-pressed="true" title="Sound on" aria-label="Sound on"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="on" d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="on" d="M15.5 9a4.2 4.2 0 010 6"/><path class="on" d="M18 6.5a8 8 0 010 11"/><path class="off" d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
      <label class="ibtn" title="Instrument sound" id="snd-lab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg><select id="snd-pick" aria-label="Instrument sound"></select></label>
      <button class="ibtn" id="bookbtn" type="button" title="Songbook" aria-label="Songbook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h6a3 3 0 013 3v12a2.5 2.5 0 00-2.5-2.5H3z"/><path d="M21 5h-6a3 3 0 00-3 3v12a2.5 2.5 0 012.5-2.5H21z"/></svg></button>
      <button class="ibtn" id="pause" type="button" disabled title="Pause" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="pause"><path d="M8 5v14M16 5v14"/></g><path class="play" d="M7 4.5v15l12-7.5z"/></svg></button>
    </div>
  </header>

  <nav class="levels" aria-label="Song">
    <div class="nrow"><span class="eyebrow">Song</span><div class="lvls" id="lvls"></div></div>
    <div class="nrow"><span class="eyebrow">Phrase</span><div class="lvls" id="gms"><span class="levelname" id="levelname"></span></div></div>
  </nav>

  <div class="board-wrap" id="stage">
    <div class="board" id="board">
      <div class="wells" id="wells"></div>
      <div class="ghost" id="ghost" hidden></div>
      <div class="layer" id="tiles"></div>
      <div class="hits" id="hits"></div>
      <div class="overlay" id="overlay"></div>
    </div>

  if(n<3||n>5||new Set(pcs).size!==n)return null;
  for(var a=0;a<n;a++){
    var r=pcs[a];
    var iv=pcs.map(function(p){return ((p-r)%12+12)%12;}).sort(function(x,y){return x-y;});
    for(var s=0;s<SHAPE_ORDER.length;s++){
      var sh=SHAPES[SHAPE_ORDER[s]].slice().sort(function(x,y){return x-y;});
      if(sh.length!==n)continue;
      var ok=true;for(var k=0;k<n;k++)if(sh[k]!==iv[k]){ok=false;break;}
      if(ok)return {root:r,q:SHAPE_ORDER[s]};
    }
  }
  return null;
}
function uniq(pcs){var o=[];pcs.forEach(function(p){if(o.indexOf(p)<0)o.push(p);});return o;}

function cleanSpell(names,pcs,flatty){
  return names.map(function(n,i){
    if(n.length>2)return (flatty?FLAT:SHARP)[pcs[i]];
    return n;
  });
}
// Build a chord. bass (a pitch class that is one of the chord tones) makes it a slash chord, and the bass sits at the bottom of the stack.
// cap is how many tiles the level stacks, so the stack length is the same for every chord in a level.
function mkChord(rootLetter,rootPc,q,numeral,bass){
  var li=LETTERS.indexOf(rootLetter);
  var iv=SHAPES[q],lab=SHAPE_LAB[q];
  var names=[],pcs=[];
  for(var k=0;k<iv.length;k++){
    var pc=(rootPc+iv[k])%12;
    pcs.push(pc);
    names.push(spellPc(LETTERS[(li+labStep(lab[iv[k]]))%7],pc));
  }
  names=cleanSpell(names,pcs,rootLetter==='F'||names[0].indexOf('♭')>0);
  var o={pcs:pcs,names:names,root:rootPc,q:q,numeral:numeral,set:sortedSet(pcs)};
  o.name=names[0]+QSUF[q];
  o.id=rootPc+':'+q;
  o.tiles=pcs.slice();
  if(bass!==undefined){
    o.bass=bass;
    o.bassName=names[pcs.indexOf(bass)];
    o.name+='/'+o.bassName;
    o.id+='/'+bass;
    o.tiles=[bass].concat(pcs);
  }
  return o;
}

  var li=LETTERS.indexOf(key.letter);
  return mkChord(LETTERS[(li+d)%7],pcs[0],t.q,(sev?NUM7:NUM3)[d]);
}
function secondary(key,t){
  var li=LETTERS.indexOf(key.letter);
  var rootPc=(key.scale[t]+7)%12;
  var letter=LETTERS[(li+t+4)%7];
  return mkChord(letter,rootPc,'dom7','V7/'+NUM3[t]);

function borrowed(key,b,sev){

// Slash chord: the diatonic chord on degree d with one of its own tones in the bass (bi 1 = third, 2 = fifth, 3 = seventh).
// With sev false it is a triad over the bass (four tiles); with sev true it is a seventh chord over the bass (five tiles).
function slashChord(key,d,bi,sev){
  var base=diatonic(key,d,sev);
  var bassDeg=(d+2*bi)%7+1;

// Extension or altered chord: a root taken from a spec (a degree, S(t) or B(b)) with any shape.

function makeChord(key,spec,sev,slashSev){

// st = {cursor, flat}. Half the time follow the progression order, otherwise draw any ready tile.
function pickTile(pool,st,now,rnd){
  var avail=[];
  for(var i=0;i<pool.length;i++)if(pool[i].readyAt<=now)avail.push(i);
  if(!avail.length)return -1;
  if(rnd()<0.5){
    for(var tries=0;tries<st.flat.length;tries++){
      var pc=st.flat[st.cursor%st.flat.length];st.cursor++;
      for(var j=0;j<avail.length;j++)if(pool[avail[j]].pc===pc)return avail[j];

// Judge a full stack, bottom to top. A song chord matches when the stack holds exactly its notes. A slash chord also needs its bass note at the bottom.
// wrongBass: the right notes with the wrong note underneath. valid: a real chord that is not in the song.
function judge(pcs,slots,found){
  var set=sortedSet(pcs),near=null;
  for(var i=0;i<slots.length;i++){
    var s=slots[i];
    if(!sameSet(set,s.set))continue;
    if(s.bass!==undefined&&pcs[0]!==s.bass){near=near||s;continue;}
    return {type:found.has(s.id)?'repeat':'new',root:s.root,q:s.q,id:s.id,slot:s,bass:s.bass};
  }
  if(near)return {type:'wrongBass',root:near.root,q:near.q,id:near.id,slot:near,bass:near.bass};
  if(set.length<pcs.length-1)return {type:'junk'};
  var t=identify(set);

  var bass=set.length<pcs.length&&pcs[0]!==t.root?pcs[0]:undefined;

function multFor(c){return Math.min(1+0.5*c,4);}
// Longer songs deal more repeated notes, so they get a bigger Focus meter: +12 for each chord beyond four.
function focusMaxFor(slotCount){return 100+12*Math.max(0,slotCount-4);}
// Focus rules. Any real chord earns Focus. A stack that is not a chord costs junkCost.
var FOCUS={first:20,firstInverted:15,repeat:10,other:2,junkCost:20,streakEvery:3,streakBonus:25};
function nextStreak(combo){return (Math.floor(combo/FOCUS.streakEvery)+1)*FOCUS.streakEvery;}
// True when the stack, read from the bottom up, is the chord in order: root, third, fifth, then seventh.
function inRootOrder(pcs,chord){

  for(var i=0;i<pcs.length;i++)if(pcs[i]!==chord.tiles[i])return false;

// Focus change and the new streak for one judged stack. The streak counts first-time finds in a row.
// For a first-time find, ordered says whether the stack was built root-first from the bottom up.
function focusOutcome(type,combo,ordered){
  if(type==='junk')return {delta:-FOCUS.junkCost,combo:0,streak:0,base:-FOCUS.junkCost};
  if(type==='valid'||type==='wrongBass')return {delta:FOCUS.other,combo:0,streak:0,base:FOCUS.other};
  if(type==='repeat')return {delta:FOCUS.repeat,combo:combo,streak:0,base:FOCUS.repeat};

// Notes of a chord, stacked upward so an extension such as the ninth sits above the seventh.
function chordMidis(root,q){

// Standard MIDI file (format 0) for a list of chords: one bar of 4/4 each, chord on channel 1, bass note on channel 2.
function vlq(n){var b=[n&127];while((n>>=7))b.unshift((n&127)|128);return b;}
function midiBytes(chords,title,bpm){

    var bp=36+(c.bass!==undefined?c.bass:c.root);

// A zip with one stored (uncompressed) file, for hosts that only allow certain file types.

/* ---------- saved progress ---------- */
var progress={done:{},all:false,runs:{},book:{}};
(function(){
  try{
    var raw=store.get('hc-progress');
    if(raw){
      var p=JSON.parse(raw);
      if(p&&typeof p==='object'){
        progress.done=p.done||{};progress.all=!!p.all;progress.runs=p.runs||{};progress.book=p.book||{};
        // saved games from the old three-wins rule: three wins counted as a finished level
        if(p.wins)for(var n in p.wins){if(!progress.done[n])progress.done[n]=p.wins[n]>=3?GAMES:Math.min(GAMES,p.wins[n]);}
      }
    }
    // One-time clean slate for the five-games-per-level ramp, so nobody starts every level on game 5.
    if(store.get('hc-ver')!=='2'&&store.get('hc-ver')!=='3'){progress={done:{},all:false,runs:{},book:{}};store.set('hc-progress',JSON.stringify(progress));store.set('hc-level','1');store.set('hc-ver','3');}
    // Songs 5 to 9: the old song 5 (Full changes) is now song 6, and a new song 5 (Slash chords) sits in front of it.
    else if(store.get('hc-ver')==='2'){
      var od=progress.done,ob=progress.book,or=progress.runs,nb={},nr={};
      if(od[5]!==undefined){od[6]=od[5];delete od[5];}
      for(var bk in ob){if(bk.charAt(0)==='5'){nb['6'+bk.slice(1)]=ob[bk];}else nb[bk]=ob[bk];}
      for(var rk in or){if(rk==='5'){var rr=or[rk];if(rr&&rr.s)rr.s='6'+rr.s.slice(1);nr['6']=rr;}else nr[rk]=or[rk];}
      progress.book=nb;progress.runs=nr;
      store.set('hc-progress',JSON.stringify(progress));
      if(store.get('hc-level')==='5')store.set('hc-level','6');
      store.set('hc-ver','3');
    }
  }catch(e){}
})();
function saveProgress(){store.set('hc-progress',JSON.stringify(progress));}
function isOpen(n){return n===1||progress.all||(progress.done[n-1]||0)>=GAMES||(progress.done[n]||0)>0;}

// A run is one song at one key, played through phrases 1 to 5. c marks the phrases found in this run.
function newRun(n){

  var prev=progress.runs[n]&&progress.runs[n].s;
  var cands=songs.filter(function(x){return x.id!==prev;});
  if(!cands.length)cands=songs;

var A={ctx:null,master:null,out:null,wet:null,muted:false,preset:'epiano'};

function initGraph(ctx){

  A.master=ctx.createGain();
  A.master.gain.value=A.muted?0:0.8;
  A.master.connect(comp);comp.connect(ctx.destination);

  var len=Math.floor(ctx.sampleRate*1.7),ir=ctx.createBuffer(2,len,ctx.sampleRate);

  A.wet=ctx.createGain();A.wet.gain.value=presetWet();
  A.master.connect(conv);conv.connect(lp);lp.connect(A.wet);A.wet.connect(comp);

var loop={on:false,next:0,i:0,timer:null,bus:null};

    while(loop.next<A.ctx.currentTime+0.6){
      var idx=loop.i%g.slots.length;
      var s=g.slots[idx];
      var wait=Math.max(0,(loop.next-A.ctx.currentTime)*1000);
      if(g.found.has(s.id)){playChord(s.root,s.q,loop.next,SLOT*0.95,0.75,false,0.012,s.bass);}

/* ---------- play ---------- */
function update(dt,now){
  G.spawnT+=dt;
  var falling=G.tiles.filter(function(t){return t.state==='fall';});
  if(G.spawnT>=G.interval&&falling.length<3){
    G.spawnT=0;spawn(now);
    falling=G.tiles.filter(function(t){return t.state==='fall';});
  }
  for(var i=0;i<falling.length;i++){
    var t=falling[i];
    t.y+=G.speed*dt;
    var eff=G.busy[t.col]?G.cap:G.cols[t.col].length;
    var L=ROWS-1-eff;
    if(t.y>=L){
      if(G.busy[t.col]){t.y=L;}
      else{t.y=L;land(t);}
    }
  }
}
function spawn(now){
  // if every tile is on the board, deal a fresh set of the notes still needed so the round cannot stall
  if(!G.pool.length)G.pool=buildPool(unfoundSlots(G.slots,G.found),1);
  var st={cursor:G.cursor,flat:G.flat};
  var i=pickTile(G.pool,st,now,Math.random);
  G.cursor=st.cursor;
  if(i<0)return;
  var entry=G.pool.splice(i,1)[0];
  var col;
  do{col=Math.floor(Math.random()*COLS);}while(col===G.lastCol&&Math.random()<0.7);
  G.lastCol=col;
  addTile(entry.pc,col);
}
function nmHtml(nm){return '<span class="nm">'+nm.charAt(0)+(nm.length>1?'<small>'+nm.slice(1)+'</small>':'')+'</span>';}

  var set=sortedSet(pcs),best=0;

    var n=sl.set.filter(function(p){return set.indexOf(p)>=0;}).length;

    playJunk(pcs);verdict(col,'Not a chord','bad');
    var near=nearMiss(pcs);
    setMsg(listNames(pcs.map(function(pc){return pcName(G.key,pc);}))+" don't make a chord. −"+FOCUS.junkCost+' Focus.'+(near?' '+near:'')+' The notes go back to the pool.','bad');
    dissolve(col,'nope',680,true,4);
  }else{
    var name=r.slot?r.slot.name:pcName(G.key,r.root)+QSUF[r.q]+(r.bass!==undefined?'/'+pcName(G.key,r.bass):'');
    if(r.type==='wrongBass'){
      G.wrong++;
      playWrongChord(r.root,r.q,undefined);verdict(col,'Wrong bass','bad');
      setMsg('Right notes, wrong bass note. '+name+' needs '+pcName(G.key,r.bass)+' at the bottom. +'+FOCUS.other+' Focus for a real chord'+(hadStreak?', but your streak resets':'')+'. The notes go back to the pool.','bad');
      dissolve(col,'nope',680,true,2.5);
    }else if(r.type==='valid'){
      G.wrong++;
      playWrongChord(r.root,r.q,r.bass);verdict(col,name,'bad');
      setMsg(name+" is a real chord, but it isn't in this song. +"+FOCUS.other+' Focus for a real chord'+(hadStreak?', but your streak resets':'')+'. The notes go back to the pool.','bad');
      dissolve(col,'nope',680,true,2.5);
    }else if(r.type==='repeat'){
      G.score+=10;
      playChord(r.root,r.q,A.ctx?A.ctx.currentTime:0,0.9,0.8,true,0.03,r.bass);
      verdict(col,name+' again','neutral');
      setMsg(name+' is already found. +'+FOCUS.repeat+' Focus for a real chord.','good');
      dissolve(col,'nope',680,true,0.5);
    }else{
      var first=G.slots.findIndex(function(s){return !G.found.has(s.id);});
      var inOrder=first>=0&&G.slots[first].id===r.id;
      var pts=Math.round((100+(inOrder?50:0))*multFor(o.combo-1));
      G.found.add(r.id);G.score+=pts;
      G.speed*=1.04;
      playChord(r.root,r.q,A.ctx?A.ctx.currentTime:0,1.4,1.1,true,0.05,r.bass);
      verdict(col,name+'  +'+pts,'good');
      // narrow the pool: notes only this chord needed leave the pool and the board
      var needed=neededPcs(G.slots,G.found);
      var gone=slot.set.filter(function(pc){return !needed.has(pc);});
      gone.forEach(function(pc){G.gone.add(pc);});
      G.pool=G.pool.filter(function(e){return needed.has(e.pc);});
      G.flat=flatTones(unfoundSlots(G.slots,G.found));
      pruneTiles(needed);
      var tail=gone.length?' '+listNames(gone.map(function(pc){return pcName(G.key,pc);}))+(gone.length===1?' leaves':' leave')+' the pool.':'';
      setMsg((G.mode==='learn'?name+' is the '+slot.numeral+' chord. ':name+' is in the song. ')+G.found.size+' of '+G.distinct.length+' found'+(inOrder?', in song order.':'.')+' '+(ordered?'Built from the root up':'Notes in a different order')+': +'+o.base+' Focus.'+(o.streak?' Streak of '+o.combo+': +'+o.streak+' Focus.':'')+tail,'good');
      dissolve(col,'locked',760,false,0);
      renderProgression();renderLegend();
      startLoop();
      if(G.found.size===G.distinct.length)win();
    }
  }
  if(G.phase==='playing'&&G.focus<=0)lose();
  renderHud();
}
function clearBoardLater(g){
  setTimeout(function(){
    if(G!==g)return;
    g.tiles.forEach(function(t){t.el.remove();});
    g.tiles=[];g.cols=emptyCols();g.busy=emptyBusy();g.active=null;
    $('ghost').hidden=true;
  },950);
}
function win(){
  var g=G;
  g.phase='won';
  g.focusBonus=Math.round(g.focus/g.focusMax*300);
  g.bonus=g.focusBonus+(g.wrong===0?300:0);
  g.score+=g.bonus;
  if(g.score>getBest(g.mode,g.level,g.game))setBest(g.mode,g.level,g.game,g.score);
  var hadNext=g.level<LEVELS.length&&isOpen(g.level+1);
  progress.done[g.level]=Math.max(progress.done[g.level]||0,g.game);
  g.run.c[g.game-1]=1;
  g.songComplete=g.run.c.every(Boolean);
  g.newSong=g.songComplete&&!progress.book[g.song.id];
  if(g.songComplete)progress.book[g.song.id]={k:g.run.k};
  saveProgress();
  g.newUnlock=g.level<LEVELS.length&&!hadNext&&isOpen(g.level+1);
  renderLevels();renderProgression();
  g.tiles.forEach(function(t){if(t.state==='fall')t.el.classList.add('nope');});
  setMsg('Every chord found. Listen to the whole song.','good');
  clearBoardLater(g);
  setTimeout(function(){if(G===g){playWin(g.key);showOverlay('won');renderHud();}},1100);
}
function lose(){
  var g=G;
  g.phase='lost';stopLoop();highlight(-1);
  g.tiles.forEach(function(t){if(t.state==='fall')t.el.classList.add('nope');});
  playLose();renderProgression();
  setMsg('Focus ran out. The song is revealed above.','bad');
  clearBoardLater(g);
  setTimeout(function(){if(G===g)showOverlay('lost');},900);
}

/* ---------- input ---------- */
function canEnter(t,col){
  if(col<0||col>=COLS||G.busy[col])return false;
  return !G.tiles.some(function(o){return o!==t&&o.state==='fall'&&o.col===col&&Math.abs(o.y-t.y)<1.05;});
}
function setCol(t,col){
  if(col===t.col)return true;
  if(!canEnter(t,col))return false;
  t.col=col;return true;
}
function activeTile(){
  var a=null;
  for(var i=0;i<G.tiles.length;i++){var t=G.tiles[i];if(t.state==='fall'&&(!a||t.y>a.y))a=t;}
  return a;
}
function moveActive(d){if(!G||G.phase!=='playing')return;var a=activeTile();if(a)setCol(a,a.col+d);}
function dropActive(){
  if(!G||G.phase!=='playing')return;
  var a=activeTile();if(!a||G.busy[a.col])return;
  a.y=ROWS-1-G.cols[a.col].length;land(a);
}
function sendTo(col){
  if(!G||G.phase!=='playing')return;
  var a=activeTile();if(!a)return;
  if(setCol(a,col))dropActive();
}
document.addEventListener('keydown',function(e){
  if(!G||e.metaKey||e.ctrlKey||e.altKey)return;
  var k=e.key;
  if((k==='p'||k==='P'||k==='Escape')&&(G.phase==='playing'||G.phase==='paused')){togglePause();e.preventDefault();return;}
  if((k==='m'||k==='M')&&canToggleMusic()){toggleMusic();e.preventDefault();return;}
  if(G.phase!=='playing')return;
  if(k==='ArrowLeft'||k==='a'||k==='A'){moveActive(-1);e.preventDefault();}
  else if(k==='ArrowRight'||k==='d'||k==='D'){moveActive(1);e.preventDefault();}
  else if(k==='ArrowDown'||k==='s'||k==='S'||(k===' '&&e.target.tagName!=='BUTTON')){dropActive();e.preventDefault();}
  else if(k>='1'&&k<='9'&&+k<=COLS){sendTo(+k-1);e.preventDefault();}
});
document.addEventListener('visibilitychange',function(){if(document.hidden)pauseGame();});
$('hits').addEventListener('click',function(e){
  var b=e.target.closest('.hit');if(!b)return;
  sendTo(+b.getAttribute('data-col'));
});

/* ---------- rendering ---------- */
function flashFocus(d){
  if(!d)return;
  var el=$('fdelta');
  el.textContent=(d>0?'+':'−')+Math.abs(Math.round(d));
  el.className='mono fdelta '+(d>0?'good':'bad');
  void el.offsetWidth;
  el.classList.add('show');
}
function setMsg(text,kind){var m=$('msg');m.textContent=text;m.className='msg'+(kind?' '+kind:'');}
function numeralsOf(){return G.slots.map(function(s){return s.numeral;}).join(' – ');}
var levelNameEl=null;
function renderLevels(){
  if(!levelNameEl)levelNameEl=$('levelname');
  var el=$('lvls');el.innerHTML='';
  LEVELS.forEach(function(L){
    var open=isOpen(L.n);
    var b=document.createElement('button');
    b.type='button';b.className='lvl'+(open?'':' locked');b.textContent=String(L.n);
    b.setAttribute('data-lv',String(L.n));
    b.setAttribute('aria-pressed',String(L.n===level));
    b.setAttribute('aria-label','Song '+L.n+': '+L.name+(open?'':', locked'));
    if(!open)b.setAttribute('aria-disabled','true');
    el.appendChild(b);
  });
  levelNameEl.textContent=LEVELS[level-1].name;
  var ge=$('gms');ge.innerHTML='';
  for(var g=1;g<=GAMES;g++){
    var gopen=isGameOpen(level,g);
    var gb=document.createElement('button');
    gb.type='button';gb.className='lvl gm'+(gopen?'':' locked')+((progress.done[level]||0)>=g?' done':'');
    gb.textContent=String(g);gb.setAttribute('data-gm',String(g));
    gb.setAttribute('aria-pressed',String(g===game));
    gb.setAttribute('aria-label','Phrase '+g+' of '+GAMES+((progress.done[level]||0)>=g?', won':'')+(gopen?'':', locked'));
    if(!gopen)gb.setAttribute('aria-disabled','true');
    ge.appendChild(gb);
  }
  ge.appendChild(levelNameEl);
}
function renderLegend(){
  var els=$('pcs').children;
  for(var i=0;i<12;i++){
    var gone=G.gone.has(i);
    els[i].classList.toggle('gone',gone);
    if(gone)els[i].setAttribute('title','Out of the pool');else els[i].removeAttribute('title');
  }
}
function renderProgression(){
  var el=$('slots');el.innerHTML='';
  el.setAttribute('data-n',String(G.slots.length));
  el.classList.toggle('wide',G.slots.length>=5&&G.slots.some(function(s){return s.name.length>6||s.tiles.length>4;}));
  G.slots.forEach(function(s){
    var found=G.found.has(s.id);
    var missed=G.phase==='lost'&&!found;
    var show=found||missed;
    var d=document.createElement('div');
    d.className='slot'+(found?' found':'')+(missed?' missed':'');
    var dots='';
    for(var i=0;i<s.tiles.length;i++)dots+=show?'<i class="on" style="background:var(--c'+s.tiles[i]+')"></i>':'<i></i>';
    var cl2=show?0:(G.clues[s.id]||0);
    var label=show?s.name:(cl2===2?s.name:(cl2===1?s.names[0]+'?':'?'));
    var shown=show||cl2===2;
    d.innerHTML='<span class="slot-name'+(shown&&s.name.length>4?(s.name.length>7?' long xl':' long'):'')+(cl2?' clue':'')+'">'+label+'</span><span class="dots">'+dots+'</span><span class="slot-num">'+((G.mode==='learn'||show)?s.numeral:'')+'</span>';
    el.appendChild(d);
  });
  var open=G.keyShown||G.phase==='won'||G.phase==='lost';
  $('keyline').textContent=open?'Key of '+G.key.name+' major':'Key hidden';
  var cl=[],pips='';
  for(var pi=0;pi<GAMES;pi++){
    pips+='<i class="pip'+(G.run.c[pi]?' on':'')+(pi===G.game-1?' cur':'')+'"></i>';
    if(pi<G.game-1&&G.run.c[pi])cl.push(G.allChords[pi].map(function(c){return c.name;}).join(' '));
  }
  $('ctx').innerHTML='<span class="pips" aria-hidden="true">'+pips+'</span><span>Phrase '+G.game+' of '+GAMES+'</span>'+(cl.length?'<span class="sofar">So far: '+cl.join(' · ')+'</span>':'');
  $('count').textContent=G.found.size+' of '+G.distinct.length+' chords found, '+G.slots.length+' in the loop';
}
// Clues go chord by chord in song order: first the root note, then the whole chord name.
function nextClueSlot(){
  return G.slots.filter(function(s){return !G.found.has(s.id)&&(G.clues[s.id]||0)<2;})[0]||null;
}
function renderHud(){
  $('score').textContent=G.score.toLocaleString();
  $('mult').textContent='×'+multFor(G.combo).toFixed(1);
  $('streaknote').textContent=(G.combo%FOCUS.streakEvery)+' of '+FOCUS.streakEvery+' to refill';
  $('best').textContent=getBest(G.mode,G.level,G.game).toLocaleString();
  var f=Math.round(G.focus);
  var pct=Math.max(0,Math.min(100,G.focus/G.focusMax*100));
  $('ffill').style.width=pct+'%';
  $('ffill').setAttribute('data-level',pct>50?'ok':(pct>25?'mid':'low'));
  $('fnum').textContent=String(f);
  $('ftrack').setAttribute('aria-valuemax',String(G.focusMax));
  $('ftrack').setAttribute('aria-valuenow',String(f));
  var playing=G.phase==='playing';
  $('b-key').disabled=!playing||G.keyShown||G.focus<=10;
  var hearCost=G.mode==='discover'?0:25;
  $('cost-song').textContent=hearCost?'−'+hearCost+' focus':'free';
  $('b-song').disabled=!playing||G.hearing||G.focus<=hearCost||!A.ctx;
  $('b-clue').disabled=!playing||G.focus<=10||!nextClueSlot();
  $('b-skip').disabled=G.phase==='ready';
  var pb=$('pause');
  var pl=G.phase==='paused';pb.classList.toggle('is-play',pl);pb.title=pb.ariaLabel=pl?'Resume':'Pause';
  pb.disabled=!(playing||G.phase==='paused')||G.hearing;
  syncMusic();
}
// A chord drawn like the cards in the song box: name, note dots, Roman numeral.
function slotCard(c,id){
  var dots='';for(var i=0;i<c.tiles.length;i++)dots+='<i class="on" style="background:var(--c'+c.tiles[i]+')"></i>';
  return '<div class="slot found" data-ci="'+id+'"><span class="slot-name'+(c.name.length>4?(c.name.length>7?' long xl':' long'):'')+'">'+c.name+'</span><span class="dots">'+dots+'</span><span class="slot-num">'+c.numeral+'</span></div>';
}
function soFarPhrases(){
  var out=[];
  G.allChords.forEach(function(pc,i){if(i<=G.game-1&&G.run.c[i])out.push({n:i+1,chords:pc});});
  return out;
}
function chordChip(c,id){return '<span data-ci="'+id+'"><b>'+c.name+'</b><i>'+c.numeral+'</i></span>';}
// Whole-song playback on its own gain bus, so it can be stopped and the chips can light up in time.
var fp={bus:null,timers:[],btn:null,label:''};
function clearChips(){var els=document.querySelectorAll('#overlay [data-ci].playing');for(var i=0;i<els.length;i++)els[i].classList.remove('playing');}
function stopFull(){
  fp.timers.forEach(clearTimeout);fp.timers=[];
  if(fp.bus&&A.ctx){
    var b=fp.bus;
    try{b.gain.cancelScheduledValues(A.ctx.currentTime);b.gain.setTargetAtTime(0,A.ctx.currentTime,0.04);}catch(e){}
    setTimeout(function(){try{b.disconnect();}catch(e){}},2500);
  }
  fp.bus=null;
  if(fp.btn){fp.btn.textContent=fp.label;fp.btn=null;}
  clearChips();
}
function playFull(list,prefix,btn){
  if(!A.ctx)return;
  stopFull();stopLoop();if(G)G.musicOff=true;
  fp.bus=A.ctx.createGain();fp.bus.gain.value=1;fp.bus.connect(A.master);
  A.out=fp.bus;
  var t0=A.ctx.currentTime+0.1;
  try{list.forEach(function(c,i){playChord(c.root,c.q,t0+i*SLOT,SLOT*0.95,0.9,true,0.012,c.bass);});}finally{A.out=null;}
  list.forEach(function(c,i){
    fp.timers.push(setTimeout(function(){clearChips();var el=document.querySelector('#overlay [data-ci="'+prefix+i+'"]');if(el)el.classList.add('playing');},100+i*SLOT*1000));
  });
  fp.timers.push(setTimeout(stopFull,200+list.length*SLOT*1000));
  if(btn){fp.btn=btn;fp.label=btn.getAttribute('data-label')||btn.textContent;btn.textContent='Stop';}
}
function startSoFar(){
  var list=flat(soFarPhrases().map(function(x){return x.chords;}));
  playFull(list,'s',document.querySelector('#overlay [data-act=sofarplay]'));
}
function flat(lists){return lists.reduce(function(a,l){return a.concat(l);},[]);}

    var cleared=G.run.c.reduce(function(a,v,i){return a+(v&&i<=G.game-1?1:0);},0);
    h='<div class="card"><h2 class="card-title">Phrase found.</h2>'+
      '<p class="sub">'+G.prog.name+': '+numeralsOf()+' in '+G.key.name+' major.</p>'+
      '<p class="chords">'+G.distinct.map(function(s){return '<span>'+s.name+'</span>';}).join('')+'</p>'+
      '<p class="big">'+G.score.toLocaleString()+'</p>'+
      '<p class="small">Includes a Focus bonus of '+G.focusBonus+(G.wrong===0?' and 300 for a clean round.':'.')+(note?' '+note:'')+'</p>'+
      '<div class="card-actions">'+
      (G.game<GAMES?'<button class="btn primary" type="button" data-act="next">Next phrase</button>':(openNext?'<button class="btn primary" type="button" data-act="levelup">Go to song '+(G.level+1)+'</button>':'<button class="btn primary" type="button" data-act="again">Play again</button>'))+
      (cleared>1?'<button class="btn" type="button" data-act="sofar">Hear the song so far</button>':'')+
      '<button class="btn" type="button" data-act="music">'+(G.musicOff?'Play phrase':'Stop phrase')+'</button>'+
      (G.game<GAMES||openNext?'<button class="btn" type="button" data-act="again">Replay</button>':'')+'</div></div>';
  }else{
    h='<div class="card"><h2 class="card-title">Out of Focus.</h2>'+
      '<p class="sub">The phrase was: '+numeralsOf()+' in '+G.key.name+' major.</p>'+
      '<p class="chords">'+G.distinct.map(function(s){return '<span>'+s.name+'</span>';}).join('')+'</p>'+
      '<div class="card-actions"><button class="btn" type="button" data-act="hear">Hear it</button><button class="btn primary" type="button" data-act="again">Try again</button></div></div>';
  }
  ov.innerHTML=h;
}
function draw(){
  var pad=layout.pad,cw=layout.colW,rh=layout.rowH;
  for(var i=0;i<G.tiles.length;i++){
    var t=G.tiles[i];
    t.el.style.transform='translate('+(t.col*cw+pad)+'px,'+(t.y*rh+pad)+'px)';
  }
  var act=G.phase==='playing'?activeTile():null;
  if(act!==G.active){
    if(G.active)G.active.el.classList.remove('active');
    if(act)act.el.classList.add('active');
    G.active=act;
  }
  var gh=$('ghost');
  if(act){
    var L=ROWS-1-(G.busy[act.col]?G.cap:G.cols[act.col].length);
    gh.hidden=false;
    gh.style.setProperty('--c','var(--c'+act.pc+')');
    gh.style.transform='translate('+(act.col*cw+pad)+'px,'+(L*rh+pad)+'px)';
  }else gh.hidden=true;
}
function doLayout(){
  var b=$('board');
  // Side-by-side layout: the board fills its column and is as tall as fits, so the bottom row stays above the fold.
  if(window.matchMedia('(min-width:860px)').matches){
    var top=b.getBoundingClientRect().top+window.scrollY;
    var below=$('collabels').offsetHeight+$('msg').offsetHeight+24;
    b.style.aspectRatio='auto';
    b.style.height=Math.max(380,Math.floor(window.innerHeight-top-below-12))+'px';
  }else{b.style.aspectRatio='';b.style.height='';}
  var r=b.getBoundingClientRect();
  if(!r.width)return;
  layout.colW=r.width/COLS;layout.rowH=r.height/ROWS;
  layout.pad=Math.max(3,Math.round(layout.colW*0.045));
  b.style.setProperty('--tw',(layout.colW-2*layout.pad)+'px');
  b.style.setProperty('--th',(layout.rowH-2*layout.pad)+'px');
}
if(window.ResizeObserver)new ResizeObserver(doLayout).observe($('board'));
window.addEventListener('resize',doLayout);
window.addEventListener('load',doLayout);

/* ---------- controls ---------- */
function setMode(m){
  mode=m;
  $('m-learn').setAttribute('aria-pressed',String(m==='learn'));
  $('m-discover').setAttribute('aria-pressed',String(m==='discover'));
  setupRound();
}
function setLevel(n){
  level=n;game=1;newRun(n);store.set('hc-level',String(n));
  setupRound();
}
$('m-learn').addEventListener('click',function(e){e.currentTarget.blur();if(mode!=='learn')setMode('learn');});
$('m-discover').addEventListener('click',function(e){e.currentTarget.blur();if(mode!=='discover')setMode('discover');});
$('lvls').addEventListener('click',function(e){
  var b=e.target.closest('[data-lv]');if(!b)return;
  b.blur();
  var n=+b.getAttribute('data-lv');
  if(!isOpen(n)){setMsg('Win all '+GAMES+' phrases in song '+(n-1)+' to unlock song '+n+'.');return;}
  if(n!==level||game!==1)setLevel(n);
});
$('gms').addEventListener('click',function(e){
  var b=e.target.closest('[data-gm]');if(!b)return;
  b.blur();
  var n=+b.getAttribute('data-gm');
  if(!isGameOpen(level,n)){setMsg('Win phrase '+(n-1)+' to unlock phrase '+n+'.');return;}
  if(n!==game){game=n;setupRound();}
});
$('snd').addEventListener('click',function(e){
  A.muted=!A.muted;
  if(A.master)A.master.gain.value=A.muted?0:0.8;
  var sb=e.currentTarget;
  sb.setAttribute('aria-pressed',String(!A.muted));
  sb.classList.toggle('is-off',A.muted);
  sb.title=A.muted?'Sound off':'Sound on';sb.setAttribute('aria-label',sb.title);
  e.currentTarget.blur();
});
(function(){
  var sel=$('snd-pick');
  PRESETS.forEach(function(p){var o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.appendChild(o);});
  sel.value=A.preset;
  function lab(){var n=PRESETS.filter(function(x){return x.id===A.preset;})[0].name;$('snd-lab').title='Instrument sound: '+n;}
  lab();
  sel.addEventListener('change',function(e){
    setPreset(sel.value);lab();audioInit();sel.blur();
    if(A.ctx&&!A.muted)playChord(0,'M',A.ctx.currentTime+0.02,1.2,0.9,true,0.07);
  });
})();
function openBook(){
  if(!G)return;
  if(G.phase==='playing')pauseGame();
  showOverlay('book');
}
$('bookbtn').addEventListener('click',function(e){e.currentTarget.blur();openBook();});
$('pause').addEventListener('click',function(e){e.currentTarget.blur();togglePause();});
$('b-music').addEventListener('click',function(e){e.currentTarget.blur();toggleMusic();});
$('b-key').addEventListener('click',function(e){
  e.currentTarget.blur();
  if(!G||G.phase!=='playing'||G.keyShown||G.focus<=10)return;
  G.keyShown=true;G.focus-=10;flashFocus(-10);
  renderProgression();renderHud();
  setMsg('Key of '+G.key.name+' major.');
});
$('b-song').addEventListener('click',function(e){
  e.currentTarget.blur();
  var cost=G&&G.mode==='discover'?0:25;
  if(!G||G.phase!=='playing'||G.hearing||G.focus<=cost)return;
  if(cost){G.focus-=cost;flashFocus(-cost);}
  renderHud();
  setMsg('Listen. The song plays once.');
  playSong();
});
$('b-clue').addEventListener('click',function(e){
  e.currentTarget.blur();
  if(!G||G.phase!=='playing'||G.focus<=10)return;
  var s=nextClueSlot();if(!s)return;
  var lvl=(G.clues[s.id]||0)+1;G.clues[s.id]=lvl;
  G.focus-=10;flashFocus(-10);
  var pos=G.slots.indexOf(s)+1;
  setMsg(lvl===1?'Clue: chord '+pos+' of the loop is built on '+s.names[0]+'.':'Clue: chord '+pos+' of the loop is '+s.name+'.');
  renderProgression();renderHud();
});
$('b-skip').addEventListener('click',function(e){e.currentTarget.blur();startRound();});
$('overlay').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='start'){audioInit();beginPlay();}
  else if(a==='resume'){resumeGame();}
  else if(a==='music'){toggleMusic();}
  else if(a==='next'){if(game<GAMES)game++;startRound();}
  else if(a==='again'){startRound();}
  else if(a==='playfull'){audioInit();if(fp.btn===b)stopFull();else playFull(flat(G.allChords),'',b);}
  else if(a==='sofar'){audioInit();showOverlay('sofar');startSoFar();}
  else if(a==='sofarplay'){audioInit();if(fp.btn===b)stopFull();else startSoFar();}
  else if(a==='sofarback'){showOverlay('won');}
  else if(a==='book'){openBook();}
  else if(a==='bookclose'){stopFull();showOverlay(G.phase==='paused'?'paused':G.phase);}
  else if(a==='bookplay'){
    audioInit();
    var id=b.getAttribute('data-id');
    if(fp.btn===b){stopFull();}
    else{var sg=songById(id),e=progress.book[id];if(sg&&e)playFull(flat(songChords(sg,e.k)),'b'+id+'-',b);}
  }
  else if(a==='levelup'){audioInit();level=G.level+1;game=1;newRun(level);store.set('hc-level',String(level));setupRound();beginPlay();}
  else if(a==='reset'){
    if(!b.getAttribute('data-sure')){b.setAttribute('data-sure','1');b.textContent='Click again to erase all progress';return;}
    progress={done:{},all:false,runs:{},book:{}};saveProgress();level=1;game=1;store.set('hc-level','1');
    setupRound();
  }
  else if(a==='unlockall'){progress.all=true;saveProgress();renderLevels();showOverlay('ready');}
  else if(a==='hear'){audioInit();playSong();}
  else if(a==='midi'){downloadMidi(b);}
});
// Save the whole song as a .mid file. Hosts that do not allow .mid get the same file inside a .zip.
function downloadMidi(btn){
  if(!G)return;
  var list=flat(G.allChords),key=G.key.name.replace(/♭/g,'b').replace(/♯/g,'sharp');
  var base=G.song.name.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-key-of-'+key;
  var mid=midiBytes(list,G.song.name,100);
  function flash(t){var o=btn.textContent;btn.textContent=t;setTimeout(function(){if(btn.isConnected)btn.textContent='Download MIDI';},2200);}
  function viaLink(name,bytes,type){
    var u=URL.createObjectURL(new Blob([bytes],{type:type}));
    var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u);},4000);flash('Saved');
  }
  var use=window.claude&&window.claude.use?window.claude.use('downloads'):Promise.resolve(null);
  Promise.resolve(use).catch(function(){return null;}).then(function(dl){
    if(!dl){viaLink(base+'.mid',mid,'audio/midi');return;}
    return dl.save({filename:base+'.mid',data:mid}).then(function(){flash('Saved');},function(err){
      var code=err&&err.code;
      if(code==='rejected_extension'||code==='extension_not_enabled'){
        return dl.save({filename:base+'.zip',data:zipBytes(base+'.mid',mid)}).then(function(){flash('Saved as .zip');},function(){flash('Not saved');});
      }
      flash(code==='declined'?'Not saved':'Could not save');
    });
  });
}

/* ---------- boot ---------- */
$('fhelp').textContent='Real chords earn Focus: +'+FOCUS.first+' the first time when the stack reads root, third, fifth, seventh and so on from the bottom up (a slash chord starts with its bass, then the chord in that order), +'+FOCUS.firstInverted+' the first time in any other order, +'+FOCUS.repeat+' when already found, +'+FOCUS.other+' when not in the song, though that resets your streak. A stack that is not a chord costs '+FOCUS.junkCost+'. Every '+FOCUS.streakEvery+' correct chords in a row refill '+FOCUS.streakBonus+'.';
(function(){
  var p=$('pcs');
  for(var i=0;i<12;i++){
    var s=document.createElement('span');
    s.style.setProperty('--c','var(--c'+i+')');
    s.textContent=SHARP[i];
    p.appendChild(s);
  }
})();
var lastTs=0;
function frame(ts){
  var dt=Math.min(0.05,Math.max(0,(ts-lastTs)/1000));lastTs=ts;
  if(G){if(G.phase==='playing')update(dt,ts/1000);draw();}
  requestAnimationFrame(frame);
}
setupRound();
requestAnimationFrame(frame);
})();
</script>
